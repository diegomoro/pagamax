name: Public Play Beta

on:
  push:
    branches:
      - public/play-beta
  pull_request:
    branches:
      - public/play-beta

permissions:
  contents: read

jobs:
  public-beta-gates:
    name: Public beta gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static public build compliance check
        run: npm run public:check

      - name: App typecheck
        run: npm run typecheck --workspace @pagamax/app

      - name: Core tests
        run: npm run core:test

      - name: Expo Doctor
        working-directory: app
        run: npx expo-doctor
