name: promo-data-pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: promo-data-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore Mercado Pago cookies
        if: ${{ secrets.MP_COOKIES_JSON != '' }}
        shell: bash
        run: |
          mkdir -p scraper/recon_out_mp
          cat > scraper/recon_out_mp/recon-cookies.json <<'EOF'
          ${{ secrets.MP_COOKIES_JSON }}
          EOF

      - name: Refresh promo data
        run: npm run data:refresh

      - name: Build Pages artifact
        run: npm run data:publish
        env:
          PROMO_DATA_BASE_URL: https://diegomoro.github.io/pagamax/promo-data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
