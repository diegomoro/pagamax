name: promo-data-pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: promo-data-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    env:
      MP_COOKIES_JSON: ${{ secrets.MP_COOKIES_JSON }}
      PROMO_REFRESH_MIN_SUCCESSFUL_SCRAPERS: 5
      PROMO_DATA_STALE_AFTER_DAYS: 7
      PROMO_DATA_MIN_PROMOS: 100

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm exec --workspace pagamax-scraper -- playwright install --with-deps chromium

      - name: Restore Mercado Pago cookies
        if: ${{ env.MP_COOKIES_JSON != '' }}
        shell: bash
        run: |
          mkdir -p scraper/recon_out_mp
          printf '%s' "$MP_COOKIES_JSON" > scraper/recon_out_mp/recon-cookies.json

      - name: Refresh promo data
        run: npm run data:refresh

      - name: Publish refresh report summary
        if: always()
        shell: bash
        run: |
          if [ -f reports/promo-refresh-report.json ]; then
            {
              echo "## Promo refresh report"
              echo
              node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('reports/promo-refresh-report.json','utf8')); console.log('- status:', r.status); console.log('- successful scrapers:', r.successful_scrapers + '/' + (r.steps || []).filter(s => s.kind === 'scraper').length); console.log('- failed:', (r.failed_scrapers || []).join(', ') || 'none'); console.log('- skipped:', (r.skipped_scrapers || []).join(', ') || 'none'); if (r.failure_reason) console.log('- failure:', r.failure_reason);"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No promo refresh report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload refresh report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promo-refresh-report
          path: reports/promo-refresh-report.json
          if-no-files-found: warn

      - name: Build Pages artifact
        run: npm run data:publish
        env:
          PROMO_DATA_BASE_URL: https://pagamenos.app/promo-data

      - name: Check Pages artifact health
        run: npm run data:health -- site/promo-data/manifest.json

      - name: Check GitHub Pages configuration
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          status="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          set -e

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled for this repository." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## GitHub Pages not deployed"
              echo
              echo "The promo data artifact was built and validated, but GitHub Pages is not enabled for this repository or the workflow token cannot read it."
              echo
              echo "HTTP status from the Pages API: \`$status\`."
              echo
              echo "Enable **Settings > Pages > Build and deployment > Source: GitHub Actions** to turn deployment back on."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Pages
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Upload static site artifact
        if: ${{ steps.pages.outputs.enabled != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: promo-data-site
          path: site
          if-no-files-found: error

  deploy:
    needs: build
    if: ${{ needs.build.outputs.pages_enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
